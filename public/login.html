<!doctype html>
<html lang="zh-CN" data-theme="velvet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <meta name="robots" content="noindex">
  <title>先对暗号</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 只用这一页：把面板的背景和按钮直接借过来，门本身尽量安静。 */
    body { display: grid; place-items: center; }

    .gate {
      width: min(330px, calc(100vw - 44px));
      max-width: none;
      margin: 0 0 14vh;
      padding: 0;
      display: grid;
      gap: 22px;
    }
    .gate h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 31px;
      font-weight: 400;
      letter-spacing: .06em;
      line-height: 1.25;
    }
    /* 唯一的高光：标题下那一小段粉线 */
    .gate h1::after {
      content: "";
      display: block;
      width: 46px;
      height: 1px;
      margin-top: 16px;
      background: var(--pink);
      opacity: .7;
    }
    .gate .lede {
      margin: -6px 0 0;
      font-size: 13px;
      line-height: 1.75;
      color: var(--muted);
    }
    .gate form { display: grid; gap: 10px; }
    .gate label {
      display: block;
      margin-bottom: 6px;
      font-size: 12.5px;
      letter-spacing: .16em;
      color: var(--muted);
    }
    .gate .field { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    .gate input {
      letter-spacing: .1em;
      padding: 12px 14px;
      transition: border-color .3s ease;
    }
    .gate input:focus {
      outline: none;
      border-color: color-mix(in srgb, var(--pink) 45%, transparent);
    }
    .gate button { padding: 12px 20px; }
    .gate .note {
      min-height: 1.3em;
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .gate .note.bad { color: var(--pink-2); }
    @media (prefers-reduced-motion: reduce) {
      .gate input { transition: none; }
    }
  </style>
</head>
<body>
  <main class="gate">
    <h1>先对暗号</h1>
    <p class="lede">私人页面，仅限本人。<br>口令不对，门就一直关着。</p>
    <form id="gate-form" novalidate>
      <div>
        <label for="pw">口令</label>
        <div class="field">
          <input id="pw" name="pw" type="password" autocomplete="current-password" autofocus required>
          <button id="go" class="primary" type="submit">开门</button>
        </div>
      </div>
      <p class="note" id="note" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('gate-form');
    const input = document.getElementById('pw');
    const go = document.getElementById('go');
    const note = document.getElementById('note');

    // 登录后回到你本来想去的页面（只接受本站路径）
    const target = (() => {
      const raw = new URLSearchParams(location.search).get('next') || '/';
      return raw.startsWith('/') && !raw.startsWith('//') ? raw : '/';
    })();

    const say = (text, bad) => {
      note.textContent = text;
      note.className = bad ? 'note bad' : 'note';
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (go.disabled) return;
      if (!input.value) { say('先填口令', true); input.focus(); return; }

      go.disabled = true;
      say('正在开门…', false);
      try {
        const res = await fetch('/api/panel-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          if (data.key) { try { localStorage.setItem('toyhub.key', data.key); } catch {} }
          say('进来了', false);
          location.replace(target);
          return;
        }
        if (res.status === 429) say('试太多次了，过十分钟再来', true);
        else if (res.status === 503) say('服务器还没设口令', true);
        else say('不对，再试一次', true);
        input.select();
      } catch {
        say('连不上服务器，看看网络', true);
      } finally {
        go.disabled = false;
      }
    });

    input.addEventListener('input', () => {
      if (note.classList.contains('bad')) say('', false);
    });
  </script>
</body>
</html>
